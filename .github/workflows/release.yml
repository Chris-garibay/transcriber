name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform builds its own whisper.cpp binary natively, so the
          # bundled engine always matches the architecture it ships to.
          - os: macos-14
            name: macOS (Apple Silicon)
            key: mac-arm64
            args: --mac --arm64
            artifact: dist/*.dmg
          # GitHub retired its Intel macOS runners, so the Intel binary is
          # cross-compiled on Apple Silicon. Verified to run under Rosetta.
          - os: macos-14
            name: macOS (Intel)
            key: mac-x64
            args: --mac --x64
            target_arch: x64
            artifact: dist/*.dmg
          - os: windows-latest
            name: Windows (x64)
            key: win-x64
            args: --win --x64
            artifact: dist/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch transcription engine
        run: npm run fetch:whisper
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          FIXTURES: test/fixtures

      # electron-vite compiles main/preload/renderer into out/; electron-builder
      # then packages that. Typecheck already ran above, so this skips it.
      - name: Build
        run: npx electron-vite build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # !cancelled() rather than always(): a platform failing should not withhold
    # the builds that succeeded, but a run someone deliberately cancelled must
    # not publish a partial release. The download step still fails loudly if
    # nothing was produced.
    # success() -- not !cancelled() -- so a failing platform blocks the release
    # instead of publishing one that is quietly missing a build. v0.1.3 went out
    # with no Windows installer because !cancelled() is still true on failure.
    if: "success() && startsWith(github.ref, 'refs/tags/v')"
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
