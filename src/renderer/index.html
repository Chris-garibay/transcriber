<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Transcriber</title>
    <!--
      blob: is required in script-src because the PCM capture AudioWorklet is
      loaded from a blob URL. Chromium checks AudioWorklet.addModule() against
      script-src (not worker-src); without it addModule rejects with an opaque
      "AbortError: The user aborted a request."
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
